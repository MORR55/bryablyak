<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Segmented Video Gaps - Responsive</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background-color: black;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .mask {
      position: relative;
      width: 100%;
      height: 100%;
      background: black;
      color: white;
      padding: 5vh 5vw;
      font-size: clamp(18px, 3vw, 36px); /* адаптивный размер шрифта */
      font-weight: bold;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2vh;
      line-height: 1.4;
      z-index: 1;
    }

    .line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1vw;
    }

    .hole {
      position: relative;
      height: 1.2em;
      overflow: hidden;
      flex-shrink: 0;
      background: transparent;
      display: inline-block;
      vertical-align: middle;
    }

    .hole video {
      position: absolute;
      top: 0;
      left: 0;
      width: 800%;
      height: auto;
      transform: translate(var(--x, 0), 0);
      object-fit: cover;
    }

    /* адаптивные ширины для отверстий */
    .hole.w1 { width: clamp(3em, 6vw, 6em); --x: -6vw; }
    .hole.w2 { width: clamp(2.5em, 4.5vw, 4.5em); --x: -12vw; }
    .hole.w3 { width: clamp(4em, 7.2vw, 7.2em); --x: -20vw; }
    .hole.w4 { width: clamp(5em, 9.5vw, 9.5em); --x: -28vw; }

  </style>
</head>
<body>

  <div class="mask">
    <div class="line">
      <span>We’re here</span>
      <span class="hole w1"><video muted autoplay loop playsinline><source src="1st.mp4" type="video/mp4"></video></span>
      <span>to make</span>
    </div>
    <div class="line">
      <span>healthy</span>
      <span class="hole w2"><video muted autoplay loop playsinline><source src="1st.mp4" type="video/mp4"></video></span>
      <span>living effortless,</span>
    </div>
    <div class="line">
      <span>so you can</span>
      <span class="hole w3"><video muted autoplay loop playsinline><source src="1st.mp4" type="video/mp4"></video></span>
      <span>live longer</span>
    </div>
    <div class="line">
      <span>and happier</span>
      <span class="hole w4"><video muted autoplay loop playsinline><source src="1st.mp4" type="video/mp4"></video></span>
    </div>
  </div>

</body>
</html>
